<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" class="bg"/>
  <rect x="7" y="7" width="18" height="18" rx="4.5" class="fg" stroke-width="2"/>
  <circle cx="16" cy="16" r="3" class="pip"/>
  <style>
    :root {
      color-scheme: light dark;
    }
    .bg { fill: #09090b; }
    .fg { stroke: #f4f4f5; }
    .pip { fill: #38bdf8; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #18181b; }
      .fg { stroke: #ffffff; }
      .pip { fill: #0284c7; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fafafa; }
      .fg { stroke: #09090b; }
      .pip { fill: #0284c7; }
    }
  </style>
</svg>
